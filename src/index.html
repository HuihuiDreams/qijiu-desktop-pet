<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Electron Security: 7. Define a Content-Security-Policy -->
  <!-- Source: https://www.electronjs.org/docs/latest/tutorial/security#7-define-a-content-security-policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pet-asset:; font-src 'self';">
  <title>岳七 & 沈九 桌面宠物</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="stat-bar.css?v=1">
  <link rel="stylesheet" href="context-menu.css?v=1">
  <link rel="stylesheet" href="dialog-bubble.css?v=1">
  <link rel="stylesheet" href="effects.css?v=2">
</head>

<body>
  <!-- Pet containers will be created dynamically by PetRenderer -->
  <div id="pet-stage"></div>

  <!-- Context menu (hidden by default) -->
  <div id="context-menu" class="context-menu hidden">
    <div class="menu-header" id="menu-header">角色名</div>
    <div class="menu-item" data-action="feed"   data-i18n="feed">🍎 喂食</div>
    <div class="menu-item" data-action="meditate" data-i18n="meditate">🧘🏻‍♂️ 打坐修炼</div>
    <div class="menu-item" data-action="pet"   data-i18n-pet>🤚 摸头</div>
    <div class="menu-item" data-action="rest"   data-i18n="rest">💤 休息</div>
    <div class="menu-separator"></div>
    <div class="menu-item" data-action="status" data-i18n="status">📊 查看状态</div>
  </div>

  <!-- Status panel (hidden by default) -->
  <div id="status-panel" class="status-panel xianxia-panel hidden">
    <div class="status-panel-header">
      <span data-i18n="statusTitle">修仙状态</span>
      <button id="status-close" class="status-close">✕</button>
    </div>
    <div id="status-content"></div>
  </div>

  <script src="data/config.js?v=3"></script>
  <script src="data/i18n.js?v=1"></script>
  <script src="data/dialogues.js?v=2"></script>
  <script src="i18nHelpers.js?v=1"></script>
  <script src="pet/Pet.js?v=2"></script>
  <script src="pet/PetRenderer.js?v=2"></script>
  <script src="pet/SpriteView.js?v=1"></script>
  <script src="systems/MovementSystem.js?v=2"></script>
  <script src="systems/WindowAwarenessSystem.js?v=1"></script>
  <script src="systems/WeatherAwarenessSystem.js?v=1"></script>
  <script src="systems/NurtureSystem.js?v=2"></script>
  <script src="systems/InteractionSystem.js?v=2"></script>
  <script src="systems/SkinManager.js?v=1"></script>
  <script src="systems/TimeSystem.js?v=2"></script>
  <script src="ui/ContextMenu.js?v=2"></script>
  <script src="ui/StatusBar.js?v=2"></script>
  <script src="ui/DialogBubble.js?v=2"></script>
  <script src="ui/WeatherParticleLayer.js?v=2"></script>
  <script src="ui/BreakReminderPresenter.js?v=1"></script>
  <script src="systems/StageGeometry.js?v=1"></script>
  <script src="systems/SkinSwitchController.js?v=1"></script>
  <script src="systems/AmbientDialogueSystem.js?v=1"></script>
  <script src="systems/OfflineReturnSystem.js?v=1"></script>
  <script src="app.js?v=7"></script>
  <script src="debug.js?v=4"></script>
</body>

</html>
