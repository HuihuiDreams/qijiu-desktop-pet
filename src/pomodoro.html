<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: pet-asset:; font-src 'self';">
  <title data-i18n="pomodoroTitle">旧书店伴读</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="pomodoro.css">
</head>

<body>
  <main id="pomodoro-panel" class="pomodoro-panel xianxia-panel" aria-live="polite">
    <header class="pomodoro-titlebar">
      <span data-i18n="pomodoroTitle">旧书店伴读</span>
      <div class="pomodoro-window-actions">
        <button id="pomodoro-pin" class="pomodoro-icon-button" type="button" aria-pressed="true" data-i18n-title="pomodoroUnpin" data-custom-tooltip data-tooltip="取消置顶">
          <svg class="pomodoro-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 4h8l-1 6 4 4v2h-6v5h-2v-5H5v-2l4-4-1-6z"></path>
          </svg>
        </button>
        <button id="pomodoro-close" class="pomodoro-icon-button" type="button" aria-label="关闭" data-i18n-title="pomodoroClose" data-custom-tooltip data-tooltip="关闭">
          <svg class="pomodoro-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="pomodoro-content">
      <div id="pomodoro-setup" class="pomodoro-state">
        <div class="pomodoro-pets" aria-hidden="true">
          <img id="pomodoro-setup-yueqi" class="pomodoro-pet pomodoro-pet--yueqi" alt="">
          <img id="pomodoro-setup-shenjiu" class="pomodoro-pet pomodoro-pet--shenjiu" alt="">
        </div>
        <h1 class="pomodoro-heading" data-i18n="pomodoroPrompt">本次专注多久？</h1>
        <div class="pomodoro-duration-stepper">
          <button id="pomodoro-decrease" class="pomodoro-step-button" type="button" data-i18n-title="pomodoroDecrease" data-custom-tooltip data-tooltip="减少">-</button>
          <label class="pomodoro-minutes-label" for="pomodoro-minutes">
            <input id="pomodoro-minutes" class="pomodoro-minutes-input" type="number" min="1" max="240" step="1" inputmode="numeric" value="25">
            <span data-i18n="trayMinuteUnit">分钟</span>
          </label>
          <button id="pomodoro-increase" class="pomodoro-step-button" type="button" data-i18n-title="pomodoroIncrease" data-custom-tooltip data-tooltip="增加">+</button>
        </div>
        <button id="pomodoro-start" class="pomodoro-primary-button" type="button" data-i18n="pomodoroStart">开始专注</button>
      </div>

      <div id="pomodoro-running" class="pomodoro-state pomodoro-state--hidden">
        <div class="pomodoro-dial-wrapper">
          <div class="pomodoro-dial-ring" aria-hidden="true"></div>
          <span class="pomodoro-dial-emblem" aria-hidden="true"></span>
          <div id="pomodoro-timer" class="pomodoro-timer">25:00</div>
        </div>
        <div class="pomodoro-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="pomodoro-progress-fill" class="pomodoro-progress-fill"></div>
        </div>
        <div class="pomodoro-pets pomodoro-pets--running" aria-hidden="true">
          <img id="pomodoro-running-cultivate" class="pomodoro-pet pomodoro-pet--scene" alt="">
        </div>
        <button id="pomodoro-stop" class="pomodoro-ghost-button" type="button" data-i18n="pomodoroStop">结束专注</button>
      </div>

      <div id="pomodoro-completed" class="pomodoro-state pomodoro-state--hidden">
        <div id="pomodoro-stamp-ceremony" class="pomodoro-stamp-ceremony" aria-hidden="true">
          <div class="pomodoro-stamp-ripple pomodoro-stamp-ripple--1"></div>
          <div class="pomodoro-stamp-ripple pomodoro-stamp-ripple--2"></div>
          <div class="pomodoro-stamp-seal"></div>
          <!-- Miracle Ceremony: White Angel & Black Demon Wing Feathers -->
          <div class="pomodoro-feather pomodoro-feather--angel pomodoro-feather--1">
            <svg viewBox="0 0 48 108" aria-hidden="true">
              <defs>
                <linearGradient id="pomodoro-angel-vane-l1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"></stop>
                  <stop offset="60%" stop-color="#fcf9f2"></stop>
                  <stop offset="100%" stop-color="#f0e4d0"></stop>
                </linearGradient>
                <linearGradient id="pomodoro-angel-vane-r1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"></stop>
                  <stop offset="50%" stop-color="#f8f2e6"></stop>
                  <stop offset="100%" stop-color="#e8d5be"></stop>
                </linearGradient>
                <linearGradient id="pomodoro-angel-quill1" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"></stop>
                  <stop offset="70%" stop-color="#d4bfa0" stop-opacity="0.95"></stop>
                  <stop offset="100%" stop-color="#a68856" stop-opacity="0.9"></stop>
                </linearGradient>
              </defs>
              <path class="pomodoro-feather-vane" d="M 30,5 C 26,12 21,22 17,34 C 15,38 16,40 15,42 C 13,49 12,62 14,72 C 16,80 20,86 24,90 C 24,82 25,60 26,40 C 27,25 29,12 30,5 Z" fill="url(#pomodoro-angel-vane-l1)"></path>
              <path class="pomodoro-feather-vane" d="M 30,5 C 30,12 28,26 27,42 C 26,60 25,78 24,90 C 28,88 31,84 32,80 C 30,78 28,76 27,73 L 33,76 C 36,70 38,62 38,54 C 35,51 31,48 28,45 L 37,49 C 40,41 41,31 40,22 C 39,13 35,7 30,5 Z" fill="url(#pomodoro-angel-vane-r1)"></path>
              <g class="pomodoro-feather-texture" stroke="#d5c09e" stroke-width="0.5" opacity="0.6" stroke-linecap="round">
                <path d="M 28,14 C 24,18 20,23 18,27"></path>
                <path d="M 27,24 C 23,30 18,36 15,41"></path>
                <path d="M 26,38 C 22,46 17,54 14,60"></path>
                <path d="M 25,52 C 22,60 18,68 15,74"></path>
                <path d="M 24,66 C 22,72 19,78 17,83"></path>
                <path d="M 29,14 C 33,18 36,22 38,25"></path>
                <path d="M 28,24 C 33,29 36,34 38,38"></path>
                <path d="M 27,38 C 32,43 36,49 37,53"></path>
                <path d="M 26,52 C 31,57 34,62 35,66"></path>
                <path d="M 25,66 C 29,71 31,75 32,78"></path>
                <path d="M 24,78 C 27,82 29,85 29,87"></path>
              </g>
              <path class="pomodoro-feather-quill" d="M 30,4 Q 26,50 23,104" stroke="url(#pomodoro-angel-quill1)" stroke-width="1.3" stroke-linecap="round" fill="none"></path>
            </svg>
          </div>
          <div class="pomodoro-feather pomodoro-feather--demon pomodoro-feather--2">
            <svg viewBox="0 0 48 108" aria-hidden="true">
              <defs>
                <linearGradient id="pomodoro-demon-vane-l2" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#34313f"></stop>
                  <stop offset="50%" stop-color="#1f1d27"></stop>
                  <stop offset="100%" stop-color="#111016"></stop>
                </linearGradient>
                <linearGradient id="pomodoro-demon-vane-r2" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#2a2834"></stop>
                  <stop offset="50%" stop-color="#16151d"></stop>
                  <stop offset="100%" stop-color="#09080d"></stop>
                </linearGradient>
                <linearGradient id="pomodoro-demon-quill2" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#625e75"></stop>
                  <stop offset="70%" stop-color="#383446"></stop>
                  <stop offset="100%" stop-color="#181720"></stop>
                </linearGradient>
              </defs>
              <path class="pomodoro-feather-vane" d="M 30,5 C 26,12 21,22 17,34 C 15,38 16,40 15,42 C 13,49 12,62 14,72 C 16,80 20,86 24,90 C 24,82 25,60 26,40 C 27,25 29,12 30,5 Z" fill="url(#pomodoro-demon-vane-l2)"></path>
              <path class="pomodoro-feather-vane" d="M 30,5 C 30,12 28,26 27,42 C 26,60 25,78 24,90 C 28,88 31,84 32,80 C 30,78 28,76 27,73 L 33,76 C 36,70 38,62 38,54 C 35,51 31,48 28,45 L 37,49 C 40,41 41,31 40,22 C 39,13 35,7 30,5 Z" fill="url(#pomodoro-demon-vane-r2)"></path>
              <g class="pomodoro-feather-texture" stroke="#3a3748" stroke-width="0.5" opacity="0.65" stroke-linecap="round">
                <path d="M 28,14 C 24,18 20,23 18,27"></path>
                <path d="M 27,24 C 23,30 18,36 15,41"></path>
                <path d="M 26,38 C 22,46 17,54 14,60"></path>
                <path d="M 25,52 C 22,60 18,68 15,74"></path>
                <path d="M 24,66 C 22,72 19,78 17,83"></path>
                <path d="M 29,14 C 33,18 36,22 38,25"></path>
                <path d="M 28,24 C 33,29 36,34 38,38"></path>
                <path d="M 27,38 C 32,43 36,49 37,53"></path>
                <path d="M 26,52 C 31,57 34,62 35,66"></path>
                <path d="M 25,66 C 29,71 31,75 32,78"></path>
                <path d="M 24,78 C 27,82 29,85 29,87"></path>
              </g>
              <path class="pomodoro-feather-quill" d="M 30,4 Q 26,50 23,104" stroke="url(#pomodoro-demon-quill2)" stroke-width="1.3" stroke-linecap="round" fill="none"></path>
            </svg>
          </div>
          <div class="pomodoro-feather pomodoro-feather--angel pomodoro-feather--3">
            <svg viewBox="0 0 48 108" aria-hidden="true">
              <defs>
                <linearGradient id="pomodoro-angel-vane-l3" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"></stop>
                  <stop offset="60%" stop-color="#fcf9f2"></stop>
                  <stop offset="100%" stop-color="#f0e4d0"></stop>
                </linearGradient>
                <linearGradient id="pomodoro-angel-vane-r3" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"></stop>
                  <stop offset="50%" stop-color="#f8f2e6"></stop>
                  <stop offset="100%" stop-color="#e8d5be"></stop>
                </linearGradient>
                <linearGradient id="pomodoro-angel-quill3" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"></stop>
                  <stop offset="70%" stop-color="#d4bfa0" stop-opacity="0.95"></stop>
                  <stop offset="100%" stop-color="#a68856" stop-opacity="0.9"></stop>
                </linearGradient>
              </defs>
              <path class="pomodoro-feather-vane" d="M 30,5 C 26,12 21,22 17,34 C 15,38 16,40 15,42 C 13,49 12,62 14,72 C 16,80 20,86 24,90 C 24,82 25,60 26,40 C 27,25 29,12 30,5 Z" fill="url(#pomodoro-angel-vane-l3)"></path>
              <path class="pomodoro-feather-vane" d="M 30,5 C 30,12 28,26 27,42 C 26,60 25,78 24,90 C 28,88 31,84 32,80 C 30,78 28,76 27,73 L 33,76 C 36,70 38,62 38,54 C 35,51 31,48 28,45 L 37,49 C 40,41 41,31 40,22 C 39,13 35,7 30,5 Z" fill="url(#pomodoro-angel-vane-r3)"></path>
              <path class="pomodoro-feather-quill" d="M 30,4 Q 26,50 23,104" stroke="url(#pomodoro-angel-quill3)" stroke-width="1.3" stroke-linecap="round" fill="none"></path>
            </svg>
          </div>
          <div class="pomodoro-feather pomodoro-feather--demon pomodoro-feather--4">
            <svg viewBox="0 0 48 108" aria-hidden="true">
              <defs>
                <linearGradient id="pomodoro-demon-vane-l4" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#34313f"></stop>
                  <stop offset="50%" stop-color="#1f1d27"></stop>
                  <stop offset="100%" stop-color="#111016"></stop>
                </linearGradient>
                <linearGradient id="pomodoro-demon-vane-r4" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#2a2834"></stop>
                  <stop offset="50%" stop-color="#16151d"></stop>
                  <stop offset="100%" stop-color="#09080d"></stop>
                </linearGradient>
                <linearGradient id="pomodoro-demon-quill4" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#625e75"></stop>
                  <stop offset="70%" stop-color="#383446"></stop>
                  <stop offset="100%" stop-color="#181720"></stop>
                </linearGradient>
              </defs>
              <path class="pomodoro-feather-vane" d="M 30,5 C 26,12 21,22 17,34 C 15,38 16,40 15,42 C 13,49 12,62 14,72 C 16,80 20,86 24,90 C 24,82 25,60 26,40 C 27,25 29,12 30,5 Z" fill="url(#pomodoro-demon-vane-l4)"></path>
              <path class="pomodoro-feather-vane" d="M 30,5 C 30,12 28,26 27,42 C 26,60 25,78 24,90 C 28,88 31,84 32,80 C 30,78 28,76 27,73 L 33,76 C 36,70 38,62 38,54 C 35,51 31,48 28,45 L 37,49 C 40,41 41,31 40,22 C 39,13 35,7 30,5 Z" fill="url(#pomodoro-demon-vane-r4)"></path>
              <path class="pomodoro-feather-quill" d="M 30,4 Q 26,50 23,104" stroke="url(#pomodoro-demon-quill4)" stroke-width="1.3" stroke-linecap="round" fill="none"></path>
            </svg>
          </div>
        </div>
        <h1 class="pomodoro-complete-title" data-i18n="pomodoroCompleted">专注完成</h1>
        <div class="pomodoro-pets pomodoro-pets--complete" aria-hidden="true">
          <img id="pomodoro-complete-kiss" class="pomodoro-pet pomodoro-pet--scene" alt="">
        </div>
        <p id="pomodoro-message" class="pomodoro-message" data-i18n="pomodoroCompleteMessage">伴读结束，喝杯大吉岭红茶休息一下吧。</p>
        <button id="pomodoro-finish" class="pomodoro-primary-button" type="button" data-i18n="pomodoroFinish">完成</button>
      </div>
    </section>

    <!-- Custom tooltip for hover annotations with Anchor Positioning and Popover API -->
    <div id="pomodoro-tooltip" class="pomodoro-tooltip" popover="manual" role="tooltip"></div>
  </main>

  <script src="data/i18n.js"></script>
  <script src="utils/windowI18n.js"></script>
  <script src="pomodoroWindow.js"></script>
</body>

</html>
