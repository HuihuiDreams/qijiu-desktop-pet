<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';">
  <title data-i18n="petScaleTitle">调整桌宠大小</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="pet-scale.css">
</head>

<body>
  <main id="scale-panel" class="scale-panel xianxia-panel" aria-live="polite">
    <header class="scale-titlebar">
      <span data-i18n="petScaleTitle">调整桌宠大小</span>
      <button id="scale-close" class="scale-close-button" type="button" aria-label="关闭" data-i18n-title="petScaleCancel" title="关闭">
        <svg class="scale-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </header>

    <div class="scale-content">
      <div class="scale-current-row">
        <div class="scale-current-info">
          <span class="scale-label" data-i18n="petScaleCurrent">当前体型：</span>
          <span id="scale-current-value" class="scale-current-value">100%</span>
        </div>
        <button id="scale-reset" class="scale-reset-button" type="button" data-i18n="petScaleReset">恢复默认</button>
      </div>

      <div class="scale-slider-container">
        <input
          id="scale-slider"
          class="scale-slider"
          type="range"
          min="50"
          max="150"
          step="5"
          value="100"
          aria-label="体型缩放滑动条"
        >
        <div class="scale-slider-labels">
          <span>50%</span>
          <span>100%</span>
          <span>150%</span>
        </div>
      </div>

      <div class="scale-actions">
        <button id="scale-cancel" class="scale-button scale-button--cancel" type="button" data-i18n="petScaleCancel">取消</button>
        <button id="scale-confirm" class="scale-button scale-button--confirm" type="button" data-i18n="petScaleConfirm">确定</button>
      </div>
    </div>
  </main>

  <script src="data/i18n.js"></script>
  <script src="utils/windowI18n.js"></script>
  <script src="petScaleWindow.js"></script>
</body>

</html>
