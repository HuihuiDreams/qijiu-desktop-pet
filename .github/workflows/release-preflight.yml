name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to validate, for example 0.3.0 or v0.3.0'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - 'readme*.txt'
      - 'build/**'
      - 'scripts/**'
      - 'src/**'
      - 'main.js'
      - 'preload.js'
      - 'updateManager.js'
      - 'test/**'

# 默认只读：pull_request 触发的作业会执行 npm ci / npm test / 构建脚本，
# 不应持有可写 token。需要推送版本号提交的作业在自身范围内单独声明 contents: write。
permissions:
  contents: read

jobs:
  sync-version:
    name: Sync package version
    # 仅手动触发时执行；pull_request 不进入这个可写作业
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync package versions with the requested release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION//[[:space:]]/}"
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be SemVer without prerelease/build metadata, got '${INPUT_VERSION}'."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PACKAGE_VERSION}" = "${VERSION}" ]; then
            echo "Package versions already match ${VERSION}."
            exit 0
          fi

          echo "Updating package versions to ${VERSION}..."
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: sync package versions to ${VERSION}"
          git push
          echo "Successfully bumped versions and pushed to repository."

  preflight:
    name: Validate release readiness
    needs: sync-version
    # pull_request 时 sync-version 会被跳过，仍需继续；它失败时则不再往下跑
    if: always() && (needs.sync-version.result == 'success' || needs.sync-version.result == 'skipped')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # 手动触发时取分支最新提交，以包含 sync-version 刚推送的版本号提交
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release readme files exist
        shell: pwsh
        run: |
          $files = @('readme_zh.txt', 'readme_en.txt', 'readme_ja.txt')
          foreach ($file in $files) {
            if (-not (Test-Path -Path $file -PathType Leaf)) {
              throw "$file is missing from the repository root."
            }
          }

      - name: Validate release metadata
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $inputVersion = if ($null -ne $env:INPUT_VERSION) { $env:INPUT_VERSION } else { '' }
          $version = $inputVersion.Trim()
          if ($version.StartsWith('v')) {
            $version = $version.Substring(1)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be SemVer without prerelease/build metadata, got '$inputVersion'."
          }

          # 版本号同步由 sync-version 作业完成并推送；这里确认检出的提交已包含它
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne $version) {
            throw "package.json version '$packageVersion' does not match the requested version '$version' after sync-version."
          }
          Write-Host "Package versions match $version."

          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw -Encoding UTF8
          $expectedHeading = "## [$version]"
          if (-not $changelog.Contains($expectedHeading)) {
            throw "CHANGELOG.md is missing a '## [$version]' release section."
          }

          $tag = "v$version"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ([string]::IsNullOrWhiteSpace($remoteTag)) {
            Write-Host "Tag $tag does not exist yet. Build Windows Installer will create it."
          } else {
            Write-Host "Tag $tag already exists and can be reused by the release workflow."
          }

      - name: Detect signing mode
        shell: pwsh
        run: |
          $hasSigningSecrets = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -and -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)

          if ($hasSigningSecrets) {
            Write-Host "Windows signing secrets are configured. Release can be signed."
          } else {
            Write-Warning "Windows signing secrets are not configured. Release will be unsigned, which is acceptable for small-group distribution."
          }
        # noinspection YAMLSchemaValidation, GitHubActionsContextInspection
        env:
          WIN_CSC_LINK: ${{ secrets['WIN_CSC_LINK'] }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets['WIN_CSC_KEY_PASSWORD'] }}

      - name: Run unit tests
        run: npm test

      - name: Verify installer prerequisites
        run: npm run verify:installer

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate protected skin assets
        run: npm run protect:assets

      - name: Build unsigned Windows smoke package
        run: npx electron-builder --win --dir --config.win.signAndEditExecutable=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged application contents
        run: npm run verify:package

  preflight-mac:
    name: Validate macOS release readiness
    needs: sync-version
    # 与 Windows 预检相同：pull_request 时 sync-version 被跳过仍需继续；它失败时则不再往下跑
    if: always() && (needs.sync-version.result == 'success' || needs.sync-version.result == 'skipped')
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # 手动触发时取分支最新提交，以包含 sync-version 刚推送的版本号提交
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate protected skin assets
        run: npm run protect:assets

      - name: Build unsigned macOS smoke package
        run: npx electron-builder --mac --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged application contents
        run: npm run verify:package

      - name: Validate macOS executable metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_app_name="七九爱宠.app"
          expected_executable="DeskPet"
          legacy_executable_name="七九爱宠"

          apps=(dist/mac*/"$expected_app_name")
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "Expected packaged macOS app named $expected_app_name under dist/mac*/."
            find dist -maxdepth 2 -name '*.app' -print || true
            exit 1
          fi

          for app in "${apps[@]}"; do
            app_name="$(basename "$app")"
            if [ "$app_name" != "$expected_app_name" ]; then
              echo "Expected outer macOS app name to be $expected_app_name, got: $app_name"
              exit 1
            fi

            executable="$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")"
            if [ "$executable" != "$expected_executable" ]; then
              echo "Expected CFBundleExecutable to be $expected_executable, got: $executable"
              exit 1
            fi

            if [ ! -x "$app/Contents/MacOS/$expected_executable" ]; then
              echo "Missing executable: $app/Contents/MacOS/$expected_executable"
              exit 1
            fi

            if [ -e "$app/Contents/MacOS/$legacy_executable_name" ]; then
              echo "Unexpected non-ASCII macOS executable remains in package."
              exit 1
            fi

            echo "Validated macOS executable metadata for $app"
          done
