name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to tag, for example 0.1.7 or v0.1.7'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release-tag:
    name: Create release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${VERSION#v}"
          TAG="v${TAG}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Requested tag ${TAG} does not match package.json version ${PACKAGE_VERSION}."
            echo "Update package.json first, or run this workflow with version ${PACKAGE_VERSION}."
            exit 1
          fi

          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "${REMOTE_SHA}" ]; then
            if [ "${REMOTE_SHA}" = "${HEAD_SHA}" ]; then
              echo "Tag ${TAG} already exists on origin and points to this commit. Continuing."
              exit 0
            fi
            echo "Tag ${TAG} already exists on origin but points to ${REMOTE_SHA}, not ${HEAD_SHA}."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

  build-windows-installer:
    name: Build NSIS installer
    needs: create-release-tag
    if: always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && needs.create-release-tag.result == 'success'))
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout release tag for manual run
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $tag = if ($version.StartsWith('v')) { $version } else { "v$version" }
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          git checkout $tag

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        run: npx electron-builder --publish ${{ github.event_name == 'workflow_dispatch' && 'always' || 'onTag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: qijiu-desktop-pet-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
