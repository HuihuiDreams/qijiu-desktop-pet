name: Build Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to tag, for example 0.3.0 or v0.3.0'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release-tag:
    name: Create release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${VERSION#v}"
          TAG="v${TAG}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Requested tag ${TAG} does not match package.json version ${PACKAGE_VERSION}."
            echo "Update package.json first, or run this workflow with version ${PACKAGE_VERSION}."
            exit 1
          fi

          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "${REMOTE_SHA}" ]; then
            echo "Tag ${TAG} already exists on origin at ${REMOTE_SHA}. Continuing with the existing tag."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

  build-windows-installer:
    name: Build NSIS installer
    needs: create-release-tag
    if: always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && needs.create-release-tag.result == 'success'))
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout release tag for manual run
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $tag = if ($version.StartsWith('v')) { $version } else { "v$version" }
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          git checkout $tag

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect signing mode
        shell: pwsh
        run: |
          $hasSigningSecrets = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -and -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)

          if ($hasSigningSecrets) {
            "SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Windows signing secrets found. Building a signed release."
          } else {
            "SIGNING_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Warning "Windows signing secrets are not configured. Building an unsigned release for small-group distribution."
          }
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build and publish signed release
        if: env.SIGNING_ENABLED == 'true'
        run: npx electron-builder --config.win.signAndEditExecutable=true --publish ${{ github.event_name == 'workflow_dispatch' && 'always' || 'onTag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build and publish unsigned release
        if: env.SIGNING_ENABLED != 'true'
        run: npx electron-builder --publish ${{ github.event_name == 'workflow_dispatch' && 'always' || 'onTag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify generated signatures
        if: env.SIGNING_ENABLED == 'true'
        run: npm run verify:signatures

      - name: Record unsigned release note
        if: env.SIGNING_ENABLED != 'true'
        shell: pwsh
        run: |
          "This release was built without Windows Authenticode signing because WIN_CSC_* secrets were not configured." | Out-File -FilePath dist\UNSIGNED-RELEASE.txt -Encoding utf8

      - name: Upload readme files to GitHub Release
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = if ($version.StartsWith('v')) { $version } else { "v$version" }
          }
          Write-Host "Uploading readme files to GitHub Release for tag $tag..."
          gh release upload $tag readme.txt readme_en.txt readme_ja.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: qijiu-desktop-pet-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/UNSIGNED-RELEASE.txt
            readme.txt
            readme_en.txt
            readme_ja.txt
          if-no-files-found: error

  build-macos-installer:
    name: Build macOS installer
    needs: create-release-tag
    if: always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && needs.create-release-tag.result == 'success'))
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout release tag for manual run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${VERSION#v}"
          TAG="v${TAG}"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout "$TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish unsigned macOS release
        run: npx electron-builder --mac --publish ${{ github.event_name == 'workflow_dispatch' && 'always' || 'onTag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Validate macOS executable metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apps=(dist/mac*/七九爱宠.app)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "No packaged macOS app found under dist/mac*/."
            exit 1
          fi

          for app in "${apps[@]}"; do
            executable="$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")"
            if [ "$executable" != "DeskPet" ]; then
              echo "Expected CFBundleExecutable to be DeskPet, got: $executable"
              exit 1
            fi

            if [ ! -x "$app/Contents/MacOS/DeskPet" ]; then
              echo "Missing executable: $app/Contents/MacOS/DeskPet"
              exit 1
            fi

            if [ -e "$app/Contents/MacOS/七九爱宠" ]; then
              echo "Unexpected non-ASCII macOS executable remains in package."
              exit 1
            fi

            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: qijiu-desktop-pet-macos-installer
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            readme.txt
            readme_en.txt
            readme_ja.txt
          if-no-files-found: error
