name: Build Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to tag, for example 0.3.0 or v0.3.0'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release-tag:
    name: Create release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${VERSION#v}"
          TAG="v${TAG}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Requested tag ${TAG} does not match package.json version ${PACKAGE_VERSION}."
            echo "Update package.json first, or run this workflow with version ${PACKAGE_VERSION}."
            exit 1
          fi

          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "${REMOTE_SHA}" ]; then
            echo "Tag ${TAG} already exists on origin at ${REMOTE_SHA}. Continuing with the existing tag."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

  build-windows-installer:
    name: Build NSIS installer
    needs: create-release-tag
    if: always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && needs.create-release-tag.result == 'success'))
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout release tag for manual run
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $tag = if ($version.StartsWith('v')) { $version } else { "v$version" }
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          git checkout $tag

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect signing mode
        shell: pwsh
        run: |
          $hasSigningSecrets = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -and -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)

          if ($hasSigningSecrets) {
            "SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Windows signing secrets found. Building a signed release."
          } else {
            "SIGNING_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Warning "Windows signing secrets are not configured. Building an unsigned release for small-group distribution."
          }
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build and publish signed release
        if: env.SIGNING_ENABLED == 'true'
        run: npx electron-builder --config.win.signAndEditExecutable=true --publish ${{ github.event_name == 'workflow_dispatch' && 'always' || 'onTag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build and publish unsigned release
        if: env.SIGNING_ENABLED != 'true'
        run: npx electron-builder --publish ${{ github.event_name == 'workflow_dispatch' && 'always' || 'onTag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify generated signatures
        if: env.SIGNING_ENABLED == 'true'
        run: npm run verify:signatures

      - name: Record unsigned release note
        if: env.SIGNING_ENABLED != 'true'
        shell: pwsh
        run: |
          "This release was built without Windows Authenticode signing because WIN_CSC_* secrets were not configured." | Out-File -FilePath dist\UNSIGNED-RELEASE.txt -Encoding utf8

      - name: Upload readme files to GitHub Release
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = if ($version.StartsWith('v')) { $version } else { "v$version" }
          }
          Write-Host "Uploading readme files to GitHub Release for tag $tag..."
          gh release upload $tag readme_zh.txt readme_en.txt readme_ja.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove auto-generated source code archives
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = if ($version.StartsWith('v')) { $version } else { "v$version" }
          }
          $repo = '${{ github.repository }}'
          $assets = gh release view $tag --repo $repo --json assets --jq '.assets[].name'
          foreach ($asset in $assets -split "`n") {
            $asset = $asset.Trim()
            if ($asset -match '(?i)^.*source.*code.*\.(zip|tar\.gz)$') {
              Write-Host "Removing source code archive: $asset"
              gh release delete-asset $tag $asset --repo $repo --yes
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: qijiu-desktop-pet-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/UNSIGNED-RELEASE.txt
            readme_zh.txt
            readme_en.txt
            readme_ja.txt
          if-no-files-found: error

  build-macos-installer:
    name: Build macOS installer
    needs: create-release-tag
    if: always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && needs.create-release-tag.result == 'success'))
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout release tag for manual run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${VERSION#v}"
          TAG="v${TAG}"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout "$TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned macOS release
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Validate macOS executable metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_app_name="七九爱宠.app"
          expected_executable="DeskPet"
          legacy_executable_name="七九爱宠"

          apps=(dist/mac*/"$expected_app_name")
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "Expected packaged macOS app named $expected_app_name under dist/mac*/."
            find dist -maxdepth 2 -name '*.app' -print || true
            exit 1
          fi

          for app in "${apps[@]}"; do
            app_name="$(basename "$app")"
            if [ "$app_name" != "$expected_app_name" ]; then
              echo "Expected outer macOS app name to be $expected_app_name, got: $app_name"
              exit 1
            fi

            executable="$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")"
            if [ "$executable" != "$expected_executable" ]; then
              echo "Expected CFBundleExecutable to be $expected_executable, got: $executable"
              exit 1
            fi

            if [ ! -x "$app/Contents/MacOS/$expected_executable" ]; then
              echo "Missing executable: $app/Contents/MacOS/$expected_executable"
              exit 1
            fi

            if [ -e "$app/Contents/MacOS/$legacy_executable_name" ]; then
              echo "Unexpected non-ASCII macOS executable remains in package."
              exit 1
            fi

            echo "Validated macOS executable metadata for $app"
          done

      - name: Upload validated macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${VERSION#v}"
            TAG="v${TAG}"
          fi
          REPO="${{ github.repository }}"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "Release $TAG" \
              || gh release view "$TAG" --repo "$REPO" >/dev/null
          fi

          assets=(dist/*.dmg dist/*.zip dist/*.blockmap)
          if [ -f dist/latest-mac.yml ]; then
            assets+=(dist/latest-mac.yml)
          fi

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS release assets found under dist/."
            exit 1
          fi

          gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove auto-generated source code archives
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${VERSION#v}"
            TAG="v${TAG}"
          fi
          REPO="${{ github.repository }}"
          for asset in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
            if echo "$asset" | grep -iqE '^.*source.*code.*\.(zip|tar\.gz)$'; then
              echo "Removing source code archive: $asset"
              gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: qijiu-desktop-pet-macos-installer
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            readme_zh.txt
            readme_en.txt
            readme_ja.txt
          if-no-files-found: error
